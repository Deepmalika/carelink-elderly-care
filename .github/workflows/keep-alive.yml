name: Keep Supabase alive

on:
  schedule:
    # Every Monday and Thursday at 06:00 UTC. Supabase's free tier pauses a
    # project after about 7 days of inactivity, so twice a week leaves a
    # comfortable margin even if one run fails.
    - cron: "0 6 * * 1,4"
  # Lets you run it by hand from the Actions tab to test it.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (runs a real database query)
        env:
          # GET /api/services is public and reads from Postgres, so a
          # successful response proves the database connection is live.
          # If your backend URL ever changes, update it here.
          URL: https://carelink-elderly-care.onrender.com/api/services
        run: |
          # The backend may be asleep (Render free tier), so allow a long
          # first response and retry a few times before giving up.
          curl --fail --silent --show-error \
            --max-time 120 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --output /dev/null \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            "$URL"